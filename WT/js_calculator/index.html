<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator">
        <h2>Glowing Calculator</h2>
        <input type="text" id="inputField" placeholder="0">
        
        <div class="buttons">
            <button class="glow-on-hover" onclick="appendNumber('1')">1</button>
            <button class="glow-on-hover" onclick="appendNumber('2')">2</button>
            <button class="glow-on-hover" onclick="appendNumber('3')">3</button>
            <button class="glow-on-hover" onclick="appendNumber('+')">+</button>

            <button class="glow-on-hover" onclick="appendNumber('4')">4</button>
            <button class="glow-on-hover" onclick="appendNumber('5')">5</button>
            <button class="glow-on-hover" onclick="appendNumber('6')">6</button>
            <button class="glow-on-hover" onclick="appendNumber('-')">-</button>

            <button class="glow-on-hover" onclick="appendNumber('7')">7</button>
            <button class="glow-on-hover" onclick="appendNumber('8')">8</button>
            <button class="glow-on-hover" onclick="appendNumber('9')">9</button>
            <button class="glow-on-hover" onclick="appendNumber('*')">*</button>

            <button class="glow-on-hover" onclick="appendNumber('0')">0</button>
            <button class="glow-on-hover" onclick="clearInput()">C</button>
            <button class="glow-on-hover" onclick="calculateSquare()">Square</button>
            <button class="glow-on-hover" onclick="appendNumber('/')">/</button>
        </div>
        <button class="glow-on-hover" onclick="calculate()">=</button>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
